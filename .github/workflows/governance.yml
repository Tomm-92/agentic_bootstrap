# Advisory: on private GitHub Free, required status checks are unavailable. Each job reports
# its own result through continue-on-error, and retention-days matches retention_days.
name: governance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  governance:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.lock
      - run: mkdir governance-report
      - name: Rule and profile schema tests
        run: .venv/bin/pytest tests/governance/test_rules.py --junitxml=governance-report/rules.xml
      - name: Commit trailers
        # A push to main also carries GitHub's merge commit, which has no trailers.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: .githooks/check_trailers.sh "$BASE_SHA..$HEAD_SHA" 2>&1 | tee governance-report/trailers.txt; exit "${PIPESTATUS[0]}"
      - name: Plan scope
        # SCOPE-002 for every coding agent, not only those the session hooks govern.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: .venv/bin/python scripts/check_scope.py "$BASE_SHA..$HEAD_SHA" 2>&1 | tee governance-report/scope.txt; exit "${PIPESTATUS[0]}"
      - name: Changed protected paths
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          {
            echo '## Changed protected paths'
            git diff --name-only "$BASE_SHA...$HEAD_SHA" -- governance docs/governance_implementation.md docs/agent_governance_implementation.md .claude/settings.json .claude/settings.local.json .claude/hooks .github .githooks AGENTS.md CLAUDE.md app/AGENTS.md app/CLAUDE.md ruff.toml pytest.ini mypy.ini | sed 's/^/- /'
          } | tee governance-report/protected-paths.md >>"$GITHUB_STEP_SUMMARY"
      - name: DEP-001 items for review
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## DEP-001: dependency manifest and allowlist changes'
            echo '```diff'
            git diff "$BASE_SHA...$HEAD_SHA" -- requirements.txt requirements-dev.txt requirements-dev.lock governance/allowlists
            echo '```'
          } | tee governance-report/dep-001.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: governance-report
          path: governance-report
          retention-days: 90
  secrets:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan the diff
        run: ./gitleaks git --log-opts="$BASE_SHA..$HEAD_SHA" --report-format sarif --report-path gitleaks.sarif
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: gitleaks
          path: gitleaks.sarif
          retention-days: 90
  dependencies:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install scanners
        run: |
          python -m pip install pip-audit
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
      - name: pip-audit
        run: pip-audit -r requirements-dev.lock --format json --output pip-audit.json
      - name: osv-scanner
        if: ${{ !cancelled() }}
        run: ./osv-scanner scan source --lockfile=requirements.txt:requirements-dev.lock --format sarif --output osv-scanner.sarif
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dependency-audit
          path: |
            pip-audit.json
            osv-scanner.sarif
          retention-days: 90
