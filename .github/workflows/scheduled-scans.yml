# Play 14: weekly full-repo scans. The PR jobs in governance.yml scan only each diff for
# secrets and the lockfiles only when a PR runs, so they miss a leak older than the
# scan and a vulnerability published since. No continue-on-error: a failed scheduled run
# emails the owner. retention-days matches retention_days.
name: scheduled-scans
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan the full history
        # SEC-002: the report is kept for 90 days, so it must not hold the secrets it finds.
        run: ./gitleaks git --redact --report-format sarif --report-path gitleaks.sarif
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: gitleaks
          path: gitleaks.sarif
          retention-days: 90
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install scanners
        run: |
          python -m pip install pip-audit==2.10.1
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
      - name: pip-audit
        run: pip-audit -r requirements-dev.lock --format json --output pip-audit.json
      - name: osv-scanner
        if: ${{ !cancelled() }}
        run: ./osv-scanner scan source --lockfile=requirements.txt:requirements-dev.lock --format sarif --output osv-scanner.sarif
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dependency-audit
          path: |
            pip-audit.json
            osv-scanner.sarif
          retention-days: 90
