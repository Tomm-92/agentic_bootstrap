# REV-001 on pull requests: posts findings only, and the human decides the merge. Advisory.
# It runs only once the owner adds ANTHROPIC_API_KEY as a repo secret, which starts paid calls
# on every pull request (COST-001). An `ai-review: no` trailer on the PR's head commit skips it.
# The job checks out the base commit, so the script, its dependencies and the rubric that run
# with the API key come from the base branch, not the PR. It reads the PR only as data, through git.
name: ai-review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  ai-review:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Read the ai-review trailer
        id: trailer
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          if [[ $(git log -1 --format='%(trailers:key=ai-review,valueonly)' "$HEAD_SHA") == no ]]; then
            echo 'skip=true' >>"$GITHUB_OUTPUT"
            echo 'Skipped: the head commit has the trailer `ai-review: no`.' >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v7
        if: ${{ env.ANTHROPIC_API_KEY != '' && steps.trailer.outputs.skip != 'true' }}
        with:
          python-version: '3.14'
      - if: ${{ env.ANTHROPIC_API_KEY != '' && steps.trailer.outputs.skip != 'true' }}
        run: pip install -r requirements-dev.lock
      - name: Review
        if: ${{ env.ANTHROPIC_API_KEY != '' && steps.trailer.outputs.skip != 'true' }}
        run: python -m scripts.ai_review "$BASE_SHA" "$HEAD_SHA" >review.md
      - name: Post findings
        if: ${{ env.ANTHROPIC_API_KEY != '' && steps.trailer.outputs.skip != 'true' }}
        run: gh pr comment "$PR_NUMBER" --body-file review.md
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && env.ANTHROPIC_API_KEY != '' && steps.trailer.outputs.skip != 'true' }}
        with:
          name: ai-review
          path: review.md
          retention-days: 90
