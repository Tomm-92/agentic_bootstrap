# From grafana/tempo v3.1.1 example/docker-compose/single-binary/tempo.yaml, without its
# metrics generator and MCP server, which this stack doesn't use.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: info
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: tempo:4317
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
