# The local telemetry stack. Every port is bound to 127.0.0.1. Grafana's first login is
# admin/admin. Run it from your own terminal: the Claude Code sandbox blocks docker.
services:
  collector:
    image: otel/opentelemetry-collector:0.165.0
    command: [--config=/etc/collector.yaml]
    volumes:
      - ./collector.yaml:/etc/collector.yaml:ro
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
    depends_on: [tempo, prometheus, loki]
  tempo:
    image: grafana/tempo:3.1.1
    command: [-target=all, -config.file=/etc/tempo.yaml]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - 127.0.0.1:3200:3200
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
  loki:
    image: grafana/loki:3.7.9
    volumes:
      - loki-data:/loki
    ports:
      - 127.0.0.1:3100:3100
  grafana:
    image: grafana/grafana:13.3.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:3000:3000
    depends_on: [tempo, prometheus, loki]
volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
